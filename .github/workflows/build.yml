name: build

# The library's own build and test suite, plus the demos.
#
# The demos are not part of the published artifact and are not in the root build's reactor, so
# nothing else would ever compile them. Without this they would rot silently until someone tried
# to follow the README and found it did not work.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The JVM the TESTS run on, not the JDK the code is compiled for: the toolchain is pinned
        # to 17 everywhere, so every job compiles the same bytecode, and the init script re-points
        # the test launcher at the matrix JDK. 17 is the target; 21 and 25 are the LTS releases
        # after it, and for a bytecode tool "works on a newer JVM" is a real risk rather than a
        # theoretical one - 25 in particular is where class-file major 69 shows up.
        #
        # Gradle itself always runs on 17: Gradle 8.11 cannot run on Java 25 at all, and which
        # JVMs Gradle runs on is Gradle's compatibility story, not this library's. Both JDKs are
        # installed below - the matrix one first, 17 last so it wins JAVA_HOME - and the toolchain
        # machinery finds the matrix JDK by auto-detection.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `build` includes :core:agentTest, which forks JVMs with -javaagent and attaches to a
      # running one. Both are the kind of thing that works locally and breaks in CI, so they are
      # deliberately not excluded here.
      - name: Build and test
        run: >
          ./gradlew build --stacktrace
          -I scripts/jdk-matrix.init.gradle
          "-Dmatrix.test.jvm=${{ matrix.java }}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  demos:
    name: demos
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Asserts each scenario reports exactly what its README claims. Most scenarios set
      # ignoreFailures so they can show their output, which means "the build went green" proves
      # nothing on its own - a checker that stopped finding anything would still pass.
      - name: Run every scenario and verify its findings
        run: ./gradlew -p demo demo --stacktrace

      # Checks the shape of the recorder's output, not just a clean exit. An agent that silently
      # stopped instrumenting looks exactly like a program that allocates nothing.
      - name: Verify the runtime flight recorder
        run: ./gradlew -p demo :07-runtime-flight-recorder:verifyRun --stacktrace
