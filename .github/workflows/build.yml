name: build

# The library's own build and test suite, plus the demos.
#
# The demos are not part of the published artifact and are not in the root build's reactor, so
# nothing else would ever compile them. Without this they would rot silently until someone tried
# to follow the README and found it did not work.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the toolchain the project targets; 21 catches anything that depends on a
        # particular JDK's bytecode or reflection behaviour, which for a bytecode tool is a real
        # risk rather than a theoretical one.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      # `build` includes :core:agentTest, which forks JVMs with -javaagent and attaches to a
      # running one. Both are the kind of thing that works locally and breaks in CI, so they are
      # deliberately not excluded here.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  demos:
    name: demos
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Asserts each scenario reports exactly what its README claims. Most scenarios set
      # ignoreFailures so they can show their output, which means "the build went green" proves
      # nothing on its own - a checker that stopped finding anything would still pass.
      - name: Run every scenario and verify its findings
        run: ./gradlew -p demo demo --stacktrace

      # Checks the shape of the recorder's output, not just a clean exit. An agent that silently
      # stopped instrumenting looks exactly like a program that allocates nothing.
      - name: Verify the runtime flight recorder
        run: ./gradlew -p demo :07-runtime-flight-recorder:verifyRun --stacktrace
