name: release

# Publishes to Maven Central and the Gradle Plugin Portal when a version tag is pushed.
#
# Deliberately manual to finish: the Central upload is staged, not auto-released, so a bad
# publication can be dropped from the portal rather than living forever. Central releases are
# irreversible - a version number can never be reused - which is worth one deliberate click.
#
# Required repository secrets (see PUBLISHING.md):
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   Central Portal user token
#   SIGNING_KEY / SIGNING_PASSWORD                     ASCII-armoured GPG private key
#   GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET         Gradle Plugin Portal API key

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Build and sign, but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Never publish something that does not pass its own checks.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match project version $VERSION." >&2
            echo "Central cannot reuse a version, so a mismatch here is worth failing on." >&2
            exit 1
          fi
          echo "Tag and project version agree: $VERSION"

      - name: Publish to Maven Central (staged)
        if: ${{ !inputs.dryRun }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

      - name: Publish the Gradle plugin to the Plugin Portal
        if: ${{ !inputs.dryRun }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins --stacktrace

      - name: Dry run summary
        if: ${{ inputs.dryRun }}
        run: |
          echo "Dry run: built and tested, published nothing."
          echo "Re-run with dryRun unchecked, or push a v* tag, to publish."
